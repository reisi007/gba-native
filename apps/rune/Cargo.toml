[workspace]
resolver = "3"
members = ["ios-platform"]

[package]
name = "gba-native-rune"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Cross-platform Rune frontend for ROM-bound gba-native applications"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
webgl = ["rune/webgl"]

[dependencies]
# Avoid Rune's optional BLAKE3 C/assembly build path on the supplied lean GCC sysroot.
blake3 = { version = "=1.8.7", features = ["pure"] }
gba-native = { package = "gba-native-core", path = "../../crates/core" }
rune = { git = "https://github.com/anomalyco/rune", rev = "bca47138e9c31a7870a79272ee2523b592b1248d", default-features = false, features = ["accessibility", "embedded-fonts"] }

[build-dependencies]
gba-native = { package = "gba-native-core", path = "../../crates/core" }

[dev-dependencies]
rune-ios-platform = { path = "ios-platform" }

[target.'cfg(target_os = "ios")'.dependencies]
rune-ios-platform = { path = "ios-platform" }

[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "bca47138e9c31a7870a79272ee2523b592b1248d", default-features = false, features = ["native-file-dialog"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Live host playback of the core's rendered PCM (CoreAudio/WASAPI/ALSA).
cpal = "0.15"
