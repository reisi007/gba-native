[workspace]

[package]
name = "gba-native-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Isolated synthetic GPU presentation frontend for the gba-native core"
publish = false

[[bin]]
name = "gba-native-desktop"
path = "src/main.rs"

[dependencies]
gba-native = { package = "gba-native-core", path = "../../crates/core" }
pixels = "=0.17.2"
winit = "=0.30.13"
