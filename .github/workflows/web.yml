name: Legacy browser frontend reference

# Retain the former apps/web implementation as an explicit behavior reference.
# Rune is the canonical browser frontend; this legacy job protects existing
# WebGPU/WebGL2 behavior without making it the shipped entrypoint.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: legacy web reference (synthetic, software GPU)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # actions/checkout v7.0.1, verified from the official tag:
      # https://api.github.com/repos/actions/checkout/git/ref/tags/v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Rust 1.98.0 with wasm32
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      # Owned Node/wasm-bindgen/npm tooling plus the pinned Playwright Chromium
      # and its Linux dependencies. No global tool installation is performed by
      # the repository scripts other than the documented Chromium cache and the
      # runner's distribution packages required by Chromium.
      - name: Provision browser toolchain
        run: bash scripts/web-browsers-install.sh

      # The same gate a developer runs locally. WebGPU is exercised with the
      # public SwiftShader flags; the UI reports the observed adapter honestly.
      # Candidate configuration under test (#24): only the functional Linux CI
      # E2E (mode ci, CI=true) is re-executed under the xvfb-run wrapper when
      # DISPLAY is unset. The wrapper comes from the runner image's xvfb package;
      # scripts/web-browsers-install.sh provisions Chromium and its distro
      # dependencies via Playwright --with-deps. A missing wrapper fails the
      # gate; it is never skipped.
      - name: Legacy browser reference gate
        env:
          WEB_LINUX_AB_DIAGNOSTICS: "1"
        run: bash scripts/web-reference.sh --ci

      # Preserve standalone smoke probes, each matched variant's Playwright
      # output, browser logs, and status summary even when a probe or suite fails.
      - name: Upload Linux WebGPU and A/B browser diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: web-reference-linux-ab-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/web-linux-ab-*/
          if-no-files-found: ignore
          retention-days: 14
