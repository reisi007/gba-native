name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.98.0
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy

      # The official action installs the pinned Ratchet binary and verifies its
      # release checksum. The repository-level gates themselves run through the
      # same short/full scripts that a developer runs locally.
      - name: Install pinned Ratchet v0.5.0
        uses: all-the-rest/ratchet-cli@4cace52ac7731985130292ead6ae81d44b4d72d6
        with:
          mode: validate
          version: v0.6.3
          tier: fast

      - name: Short gate
        run: ./scripts/short.sh

      - name: Full gate
        run: ./scripts/full.sh
